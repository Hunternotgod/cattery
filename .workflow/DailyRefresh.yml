version: "1.0"
name: daily-refresh
displayName: 每日刷新 Gitee 数据
stages:
- name: 刷新站点
  displayName: 刷新站点
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: trigger_edgeone
    displayName: 触发 EdgeOne 部署
    nodeVersion: 14.16.0
    commands:
    - "test -n \"${EDGEONE_DEPLOY_HOOK}\""
    - 'status=0; curl --fail --silent --show-error --max-time 8 --request POST "${EDGEONE_DEPLOY_HOOK}" >/dev/null || status=$?; [ "$status" -eq 0 ] || [ "$status" -eq 28 ]'
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  schedule:
  - cron: 0 0 16 * * ?
notify: []
ref_variable:
- EDGEONE_DEPLOY_HOOK

